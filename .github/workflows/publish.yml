name: Publicar Paquete

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publicar Tema Slidev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y validar el tema
        run: npm run build

      # Publicación en npmjs.org
      - name: Publicar en npm (npmjs.org)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publicación opcional en GitHub Packages (si el paquete es scoped o se usa GITHUB_TOKEN)
      - name: Publicar en GitHub Packages
        continue-on-error: true
        run: |
          npm config set //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          npm publish --registry=https://npm.pkg.github.com/
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
