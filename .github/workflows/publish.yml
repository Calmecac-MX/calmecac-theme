name: Publicar Paquete

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publicar Tema en npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar y validar el tema
        run: npx @slidev/cli build example.md

      # Publicación en npmjs.org
      - name: Publicar en npm (npmjs.org)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publicación opcional en GitHub Packages
      - name: Publicar en GitHub Packages
        continue-on-error: true
        run: |
          npm config set //npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}
          npm publish --registry=https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
