name: Publicar Paquete

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publicar Tema en npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Instalar dependencias
        run: npm install

      # Automatización de la versión del paquete según los cambios en los commits:
      # - 'feat:' -> incrementa versión MINOR (ej. 1.3.0 -> 1.4.0)
      # - 'BREAKING CHANGE' / 'feat!:' -> incrementa versión MAJOR (ej. 1.3.0 -> 2.0.0)
      # - 'fix:', 'refactor:', 'style:', etc. -> incrementa versión PATCH (ej. 1.3.0 -> 1.3.1)
      - name: Automatizar asignación de versión de paquete
        uses: phips28/gh-action-bump-version@v11.0.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: patch
          target-branch: main
          tag-prefix: 'v'
          commit-message: 'chore(release): bump package version to {{version}} [skip ci]'

      - name: Compilar y validar el tema
        run: npx @slidev/cli build example.md

      # Publicación en npmjs.org
      - name: Publicar en npm (npmjs.org)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
